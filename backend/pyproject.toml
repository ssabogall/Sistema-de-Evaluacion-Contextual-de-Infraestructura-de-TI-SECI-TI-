[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seci-ti-backend"
version = "0.1.0"
description = "PB-01 requirement extraction API for SECI-TI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "openai>=1.66,<3.0",
  # Sin tope de version fijado a proposito: instalen con
  # `pip install google-genai` y luego fijen aqui la version real que
  # quedo resuelta (revisando antes el changelog del SDK), en vez de
  # confiar en un rango que no verificamos.
  "google-genai",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.8,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: calls the configured external AI provider",
]
