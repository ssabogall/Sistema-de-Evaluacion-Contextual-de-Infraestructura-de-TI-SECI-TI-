[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seci-ti-backend"
version = "0.1.0"
description = "PB-01 requirement extraction API for SECI-TI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "openai>=1.66,<3.0",
  # Sin tope de version fijado a proposito: instalen con
  # `pip install google-genai` y luego fijen aqui la version real que
  # quedo resuelta (revisando antes el changelog del SDK), en vez de
  # confiar en un rango que no verificamos.
  "google-genai",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.8,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  # Sin version fijada, mismo criterio que con google-genai: instalen y
  # confirmen la version real resuelta antes de depender de un rango que
  # no verificamos.
  "ruff",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: calls the configured external AI provider",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Deliberadamente minimo: errores reales (F = pyflakes, pycodestyle basico),
# orden de imports (I), y errores comunes (B = bugbear). Nada de reglas de
# docstrings (D) ni de forzar anotaciones en todo (ANN) -- eso si generaria
# mas friccion de la que vale la pena para un sprint de 1-2 semanas.
select = ["E", "F", "I", "UP", "B"]
# B008 se desactiva a proposito: FastAPI usa `Depends(...)` como valor por
# defecto de un parametro de forma intencional (es su patron oficial de
# inyeccion de dependencias, documentado por el propio framework). La
# regla generica de Python que detecta "no llames funciones en defaults"
# no aplica aqui -- no es un bug, es como FastAPI espera que se escriba.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Los casos curados son texto descriptivo en espanol (los casos de negocio
# de prueba), no codigo -- forzarlos a 100 caracteres los parte de forma
# arbitraria sin ganar legibilidad real. Se desactiva solo E501, solo en
# este archivo.
"tests/test_curated_cases.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
